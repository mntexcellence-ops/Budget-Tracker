<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget Tracker — DEKKO ISHO Group</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f8f8f8;--card:#FFFFFF;--border:#e8e8e8;--text:#292d34;--body:#4a4a4a;--muted:#80868b;--faint:#9aa0a6;--soft:#f9f9f9;--soft2:#f5f5f5;--shadow:rgba(0,0,0,.06);--shadow-md:0 4px 14px rgba(0,0,0,.09);--shadow-lg:0 12px 32px rgba(0,0,0,.16);--radius:8px;--brand:#7b68ee;--brand-b:#6a5ae0;--side:#ffffff}
[data-theme="dark"]{--bg:#1a1f3b;--card:#282d47;--border:#3a4066;--text:#e8e8e8;--body:#d0d0d0;--muted:#9a9a9a;--faint:#777777;--soft:#232842;--soft2:#2c3150;--shadow:rgba(0,0,0,.35);--shadow-md:0 4px 14px rgba(0,0,0,.45);--shadow-lg:0 12px 32px rgba(0,0,0,.5);--radius:8px;--brand:#fed800;--brand-b:#fed800;--side:#1e2340}
[data-theme="dark"] .entrybtn,[data-theme="dark"] .fsbtn.pri,[data-theme="dark"] .efseg button.on{color:#1a1f3b}
[data-theme="dark"] input{color-scheme:dark}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;padding:14px;transition:background .25s,color .25s}
.app{max-width:1460px;margin:0 auto}
/* v10.46: sticky header — stays pinned at the top while scrolling, like the
   sidebar; opaque theme background so scrolled content never shows through. */
.topbar{position:sticky;top:0;z-index:60;background:var(--bg);border:0;border-radius:0;padding:10px 4px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;box-shadow:none;margin-bottom:14px}
/* v10.47: task names stay on one line — first 40 letters + "..." (see shortName;
   v10.57 changed it from 25 words to 40 letters, project names only),
   full name on hover via title. td cap keeps the 13-column table usable;
   cards/deadline rows use the full width available to them. */
/* v10.48: date cells never wrap (.dt) so list rows get as short as possible;
   task-column cap raised 300px → 560px so more of the name shows. */
/* v10.49: every list-row text cell is one line now — Unit/Priority/Budget Status
   nowrap (.dt); Materials Status + Remarks (Latest Comment) use tnameW() with a
   240px cap (.tname.sm) so the full text stays one hover away. The Progress cell
   also gets .dt: its 90px bar + "%" text wrapped to two lines and was the last
   thing holding rows at 54px (measured: hiding it alone drops a row to 37px). */
.dt{white-space:nowrap}
/* v10.58: Project List Budget Status column 4px smaller (13px → 9px) —
   list only; the filter dropdown and the Edit/Add form stay 13px.
   v10.59: too small to read — back up to a uniform 11px for both
   columns (Budget Status and Last Workflow). */
.bstcell{font-size:11px}
.tname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
td .tname{max-width:560px}
td .tname.sm{max-width:240px}
.brand{display:flex;align-items:center;gap:12px}
.top-logo{height:40px;width:auto;display:block;flex:none}
[data-theme="dark"] .top-logo{filter:brightness(0) invert(1)}
.brand h1{font-size:20px;font-weight:600;letter-spacing:.2px}
.brand h1 span{color:var(--brand-b)}
.brand p{font-size:11.5px;color:var(--muted)}
.live{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto;font-size:11px;color:var(--muted);text-align:right}
.layout{display:grid;grid-template-columns:222px 1fr;gap:14px}
.side{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;box-shadow:0 1px 2px var(--shadow);height:fit-content;position:sticky;top:14px}
.side h3{font-size:12px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text);border-bottom:2px solid var(--brand-b);padding-bottom:8px;margin-bottom:12px}
.fsec{margin-bottom:16px}
.fsec h4{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);margin-bottom:7px}
.fitem{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 2px;cursor:pointer;color:var(--body)}
.fitem input{accent-color:var(--brand-b);width:14px;height:14px}
.reset{font-size:11.5px;color:var(--brand);cursor:pointer;text-decoration:underline}
.dd{position:relative}
.ddbtn{width:100%;text-align:left;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--soft);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddpanel{margin-top:6px;border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--card);box-shadow:0 4px 14px var(--shadow)}
.ddtools{display:flex;gap:12px;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px}
.ddtools span{font-size:11.5px;color:var(--brand);cursor:pointer;font-weight:600}
.dlabel{display:block;font-size:11px;color:var(--muted);margin:7px 0 3px}
.dinput{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text);background:var(--card);font-family:inherit}
.toolbtn{width:100%;text-align:left;padding:9px 12px;border:1px solid #d9d9d9;border-radius:6px;background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:8px}
[data-theme="dark"] .toolbtn{border-color:#3a4066}
.toolbtn:hover{border-color:var(--brand-b)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px 8px;box-shadow:0 1px 2px var(--shadow);position:relative;min-width:0}
.kpi .ic{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:600;padding-right:36px;line-height:1.4}
.kpi .chip{white-space:normal;line-height:1.4}
.kpi .v{font-size:clamp(14px,1.3vw,20px);font-weight:800;margin:5px 0 5px;color:var(--text);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.g{background:#DCF5E5;color:#15803D}.chip.r{background:#FDE3E3;color:#DC2626}.chip.n{background:var(--soft2);color:var(--muted)}
.chip.b{background:#DBEAFE;color:#1D4ED8}.chip.y{background:#FEF3C7;color:#B45309}
[data-theme="dark"] .chip.g{background:#123B25;color:#4ADE80}
[data-theme="dark"] .chip.r{background:#3D1A1A;color:#F87171}
[data-theme="dark"] .chip.b{background:#16294D;color:#7FB0FF}
[data-theme="dark"] .chip.y{background:#3A2E12;color:#FCD34D}
.stpill{display:inline-block;font-size:11px;font-weight:600;color:#fff;padding:2px 10px;border-radius:999px;white-space:nowrap}
.st-open{background:#9aa0a6}.st-inprog{background:#5b8def}.st-wating{background:#b07fe8}.st-complete{background:#4caf50}
[data-theme="dark"] .st-open{background:#a8adb3}[data-theme="dark"] .st-inprog{background:#6b9dff}[data-theme="dark"] .st-wating{background:#c09bf0}[data-theme="dark"] .st-complete{background:#5cb85c}
.avt{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;vertical-align:middle;flex:none}
.avstack{display:inline-flex;margin-right:6px;vertical-align:middle}
.avstack .avt{margin-left:-6px;border:2px solid var(--card)}
.avstack .avt:first-child{margin-left:0}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge.od{background:#fdecec;color:#e5484d;border:1px solid #f8c8c8}
.badge.soon{background:#FEF3C7;color:#B45309;border:1px solid #FDE68A}
[data-theme="dark"] .badge.od{background:#3D1A1A;color:#F87171;border-color:#5B2323}
[data-theme="dark"] .badge.soon{background:#3A2E12;color:#FCD34D;border-color:#54431A}
tr.odrow td{background:#fdf0f0}
[data-theme="dark"] tr.odrow td{background:#2B1A1A}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 18px;box-shadow:0 1px 2px var(--shadow);min-width:0;overflow-x:auto}
.card h3{font-size:13.5px;font-weight:700}
.card h3 i{font-style:normal;color:var(--brand-b);margin-right:6px}
.card .s{font-size:11px;color:var(--faint);margin:2px 0 10px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;padding:7px 8px;border-bottom:2px solid var(--border);background:var(--soft);position:sticky;top:0}
td{padding:7.5px 8px;border-bottom:1px solid var(--border);color:var(--body)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:800;color:var(--text);background:#f5f3ff;border-top:2px solid var(--brand-b)}
[data-theme="dark"] tr.tot td{background:#2e3352}
.tblscroll{max-height:560px;overflow:auto}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px}
.leg div{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.nav{position:fixed;right:0;top:0;bottom:0;width:44px;display:flex;flex-direction:column;gap:10px;padding:16px 0;margin:0;z-index:50}
.nav div{background:var(--card);border:1px solid var(--border);border-radius:12px;text-align:center;padding:18px 0;font-size:12px;font-weight:800;letter-spacing:1px;color:var(--text);box-shadow:0 1px 2px var(--shadow);writing-mode:vertical-rl;transform:rotate(180deg)}
.nav div span{color:var(--brand-b);display:block;margin:0 0 2px 0}
.nav div.act{background:linear-gradient(135deg,#7b68ee,#6a5ae0);color:#fff;border-color:#7b68ee}
.nav div.act span{color:#fff}
.foot{text-align:center;color:var(--faint);font-size:11px;margin-top:14px}
.view{display:none}
.view.on{display:block}
.nav div{cursor:pointer;user-select:none}
.nav div:hover{border-color:var(--brand-b)}
.insight{display:flex;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:8px;background:var(--soft);margin-bottom:10px}
.insight .ii{font-size:20px;line-height:1.2}
.insight h4{font-size:13px;margin-bottom:2px;color:var(--text)}
.insight p{font-size:12px;color:var(--muted);line-height:1.5}
.insight b{color:var(--text)}
.pbar{display:inline-block;width:90px;height:9px;background:var(--soft2);border-radius:5px;vertical-align:middle;overflow:hidden}
.pbar i{display:block;height:9px;background:var(--brand-b);border-radius:5px}
@media(max-width:1100px){.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}.s3,.s4,.s6,.s12{grid-column:span 12}}
@media(min-width:681px){main{padding-right:58px}}
@media(max-width:680px){body{padding:8px}.kpis{grid-template-columns:repeat(2,1fr);gap:9px}.nav{position:static;width:auto;height:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0;margin-top:14px}.nav div{writing-mode:horizontal-tb;transform:none;padding:11px 3px}.nav div span{display:inline;margin-right:7px}.topbar{flex-wrap:wrap;gap:10px;padding:12px 4px}.brand h1{font-size:16px}.side{position:static}.card{padding:13px 12px}.kpi{padding:11px 12px 6px}}
@media(max-width:380px){.kpi .v{font-size:13px}.nav div{font-size:10.5px;padding:11px 3px}}
.kpi{cursor:pointer}
.kpi:hover{border-color:var(--brand-b)}
.fsmodal{position:fixed;inset:0;background:#00000066;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.fsbox{background:var(--card);border:1px solid var(--border);border-radius:8px;width:100%;max-width:1180px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
@media(max-width:680px){.fsmodal{padding:12px 8px}}
.fshead{background:var(--card);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fshead h2{font-size:16px}
.fshead .tot{font-size:12.5px;color:var(--muted)}
.fsbody{flex:1;overflow:auto;padding:14px 18px}
.fsbtn{background:var(--card);color:var(--text);border:1px solid #d9d9d9;border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
[data-theme="dark"] .fsbtn{border-color:#3a4066}
.fsbtn.pri{background:var(--brand);color:#fff;border:0}
.fsbtn:disabled{opacity:.55;cursor:wait}
.efinput{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text);background:var(--card);font-family:inherit}
.efgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.efgrid label{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}
.efseg{display:flex;background:var(--soft2);border-radius:9px;padding:3px}
.efseg button{flex:1;border:0;background:transparent;padding:8px 2px;font-size:12.5px;font-weight:700;color:var(--muted);border-radius:7px;cursor:pointer}
.efseg button.on{background:var(--brand);color:#fff}
.entrybtn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer}
.entrybtn:disabled{opacity:.55;cursor:wait}
.entrybtn.off{background:var(--soft);color:var(--text);border:1px solid var(--border)}
.xbtn{background:var(--soft);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
@media(max-width:680px){.efgrid{grid-template-columns:repeat(2,1fr)}}
.fsmsg{font-size:12.5px;min-height:18px;padding:6px 18px;background:var(--card)}
.fsmsg.ok{color:#15803D}.fsmsg.err{color:#DC2626}
.dtmodal{position:fixed;inset:0;background:#00000066;z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
.dtcard{background:var(--card);border:1px solid var(--border);border-radius:8px;width:100%;max-width:720px;box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden}
.dthead{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.dthead h2{font-size:16px;line-height:1.3;flex:1;min-width:220px}
.dtsec{padding:12px 18px;border-bottom:1px solid var(--border)}
.dtsec h4{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.dtgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:13px}
.dtgrid b{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;display:block}
.rowclick{cursor:pointer}
.rowclick:hover td{background:var(--soft)}
.rowcb{width:16px;height:16px;accent-color:#7b68ee;cursor:pointer}
tr.selrow td{background:#f5f3ff}
[data-theme="dark"] tr.selrow td{background:#332f4d}
@media(max-width:680px){.dtgrid{grid-template-columns:1fr}.dtmodal{padding:12px 8px}}
/* v2: full-page task view (task pane) + per-unit sections + subtasks */
.dtmodal{position:fixed;inset:0;background:var(--card);z-index:200;overflow:auto;padding:0;align-items:stretch;justify-content:flex-start}
.dtcard{background:var(--card);min-height:100%;max-width:none;border:0;border-radius:0;box-shadow:none;overflow:visible}
.dtwrap{max-width:980px;margin:0 auto;padding:0 18px 40px}
.dthead{position:sticky;top:0;background:var(--card);z-index:5;padding:14px 0}
.dtsec{padding:12px 0}
.unitsec{margin-bottom:18px}
.usec-head{display:flex;gap:8px 14px;align-items:baseline;flex-wrap:wrap;background:var(--soft);border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:8px}
.usec-head b{font-size:14px;color:var(--text)}
.usec-head span{font-size:12px;color:var(--muted)}
.usec-empty{font-size:12.5px;color:var(--muted);padding:10px 4px}
.odtxt{color:#e5484d;font-weight:700;font-size:11px;white-space:nowrap}
[data-theme="dark"] .odtxt{color:#F87171}
/* v10.43: Last Workflow column — step name clamps to 2 lines, the
   who/days line truncates with ellipsis; 7+ days sitting gets amber.
   v10.58: 4px smaller — step/done 12px → 8px, who/days 11px → 7px, and
   the empty "—" 13px → 8px via .lwcell.
   v10.59: 8px/7px was too small to read — both columns now a uniform
   11px (step, who/days, done and the empty "—"). */
.lwcell{max-width:230px;min-width:150px;font-size:11px}
.lwstep{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.35}
.lwsub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lw-old{color:#b45309;font-weight:700}
[data-theme="dark"] .lw-old{color:#f59e0b}
/* v10.44: a Complete task shows just "Complete" in green in the Last
   Workflow column — no step, who, days or next step; workflow
   maintenance is over for that task. */
.lw-done{color:#15803d;font-weight:700;font-size:11px}
[data-theme="dark"] .lw-done{color:#22c55e}
.subrow{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--border);font-size:13px}
.subrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand-b);flex:none}
.subrow .submain{flex:1;min-width:0}
.subrow .subname{font-weight:600}
.subrow .submeta{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.5}
/* v10.10: a completed subtask shows a GREEN tick and is NOT struck through. */
.subrow .subtick{color:#4caf50;font-weight:700;font-size:15px;flex:none}
.subedit{background:transparent;border:0;color:var(--faint);cursor:pointer;font-size:14px;padding:2px 6px}
.subedit:hover{color:var(--text)}
.subdue{font-size:11.5px;color:var(--muted);white-space:nowrap}
.subdel{background:transparent;border:0;color:var(--faint);cursor:pointer;font-size:15px;padding:2px 6px}
.subdel:hover{color:#DC2626}
.subadd{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.subadd input[type=text]{flex:1;min-width:180px}
.tmrow{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.tmrow:last-child{border-bottom:0}
.tmrow b{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
@media(max-width:680px){.dtmodal{padding:0}.dtwrap{padding:0 12px 32px}}
/* v3: left sidebar + Board + Calendar + view bar */
.layout{grid-template-columns:264px 1fr;transition:grid-template-columns .25s ease}
main{padding-right:0}
#sbToggle{display:none;background:var(--soft);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:15px;cursor:pointer}
.cside{background:var(--side);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:14px 12px;height:fit-content;position:sticky;top:14px;box-shadow:0 1px 2px var(--shadow)}
.wshead{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;border-bottom:1px solid var(--border);margin-bottom:12px}
.wslogo{width:34px;height:34px;border-radius:50%;background:#7b68ee;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;flex:none}
/* v10.29: dark mode only — the purple "D" avatar becomes yellow on navy,
   matching the dark theme (light mode keeps the purple ClickUp look). */
[data-theme="dark"] .wslogo{background:#fed800;color:#1a1f3b}
/* ── v5 polish: 8px rhythm, focus rings, refined scrollbars, hover lift ── */
:focus-visible{outline:2px solid var(--brand-b);outline-offset:1px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d4d4d4;border-radius:6px;border:2px solid var(--bg)}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#4a4a4a;border-color:#1a1a1a}
.kpi{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.kpi:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--shadow);border-color:var(--brand-b)}
.bdcard{transition:transform .15s ease,box-shadow .15s ease}
.bdcard:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.10)}
.bdcard .pbar{height:6px}
.bdcard .pbar i{height:6px}
.calday{min-height:92px}
.calhead b{font-size:16px;font-weight:700}
.calchip{padding:3px 6px}
.usec-empty{font-size:13px;color:var(--muted);padding:20px 12px;text-align:center;border:1px dashed var(--border);border-radius:8px;background:var(--soft)}
.fsbtn,.efinput,.entrybtn,.xbtn,.toolbtn{border-radius:8px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:.3px}

/* ── v10.55: board columns must shrink below their content — `1fr` is
   `minmax(auto,1fr)`, so one long nowrap card title forced each column to
   ~1100px and the board scrolled sideways. `minmax(0,1fr)` lets the 3
   columns share the board width and long titles clip with ellipsis. ── */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}

   white text, colored column dots. In Progress=orange,
   Wating=red, Complete=green.

   text) at the owner's request — the solid-color cards are gone; the
   colored column dots stay.
   v10.56 (2026-11-16): solid-color cards restored at the owner's request —
   the 4 colors are back; compact sizes (v10.54) and narrow columns (v10.55)

.bdcol-dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}

/* ── v9: premium design system — top bar, KPI share bars, toasts, grid, skeleton ── */

.profile-chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600;color:var(--text);box-shadow:0 1px 2px var(--shadow);white-space:nowrap}
.pc-avt{width:28px;height:28px;border-radius:50%;background:var(--brand-b);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
#btnQuickAdd{white-space:nowrap}
.kpi .share{height:4px;background:var(--soft2);border-radius:3px;overflow:hidden;margin-top:9px}

#toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:min(360px,90vw)}
.toast{background:#292d34;color:#fff;border-radius:var(--radius);padding:11px 14px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);cursor:pointer;animation:toastIn .25s ease}
.toast.ok{background:#15803D}
.toast.err{background:#dc2626}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cfmodal{position:fixed;inset:0;background:#00000066;z-index:250;display:flex;align-items:center;justify-content:center;padding:16px}
.cfbox{background:var(--card);border:1px solid var(--border);border-radius:10px;max-width:420px;width:100%;padding:20px;box-shadow:var(--shadow-lg)}

/* ── v10: Stage History timeline — vertical line + dots, status pills ── */
.tl{position:relative;margin:6px 0 2px 6px;padding-left:20px}
.tl:before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tlrow{position:relative;padding:7px 0}
.tlrow:before{content:'';position:absolute;left:-19px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--brand-b);border:2px solid var(--card)}
.tlrow.cur:before{background:#4caf50}
/* ── v10.52: a journey stage not reached yet — hollow dot, muted head;
   the nested blocks inside it stay full-strength so steps can still be added. ── */
.tlrow.upcoming:before{background:var(--card);border-color:var(--muted)}
.tlrow.upcoming .tl-stage-head{opacity:.55}
.tl-meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.tl-note{font-size:12px;color:var(--muted);margin:8px 0 2px}
/* ── v10.9: subtasks inside the current stage (Stage History) ── */
.tl-subs{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px}
.tl-subs-h{font-size:12px;font-weight:700;margin-bottom:2px}
.tl-sub{padding:5px 0;font-size:13px;line-height:1.45}
.tl-sub .tl-sub-name{font-weight:600}
.tl-sub .tl-sub-done{color:#4caf50}
.tl-sub-meta{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.5}
/* ── v10.25/26: Workflow Steps — approval/execution chain, shown inside
   Stage History since v10.26 (no standalone section any more).
   The table scrolls sideways on narrow screens so the page never overflows. ── */
.wfscroll{overflow-x:auto}
.wftable{width:100%;min-width:640px;border-collapse:collapse;font-size:13px}
.wftable th,.wftable td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.wftable th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.wftable tr.wf-pending td{color:var(--muted)}
.wftable tr.wf-done td:first-child{font-weight:700}
.wftable tr.wfsec td{background:#1a1f3b;color:#fed800;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.wfstep-no{white-space:nowrap;color:var(--muted);font-size:12px}
.wfadd{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:flex-end}
.wfadd .efinput{min-width:120px}
.wfadd select.efinput{flex:2;min-width:220px}
.wfadd input[type=text]{flex:1;min-width:140px}
.wfadd input[type=date]{max-width:170px}

   visible, its steps table hides when collapsed. The collapsed class lives
   on the block wrapper OUTSIDE its .wf-sec-body, so wfRefresh() never

.wf-sec{margin-top:10px}
.wf-head .fsbtn{flex:0 0 auto;padding:5px 10px}

   once, and only then sends the write to the script in the background
   (the Apps Script round-trip is a cold start and takes 5–15 s — the
   user must never wait for it). On success the silent refresh converges
   server-computed values; on failure the local change is rolled back and
   a clear error is shown, so the screen never shows data the Sheet does
   not have. There is no "⏳ Saving..." wait state anywhere on the save
   path, and no Save button stays disabled while the user waits.

   while a write for the same item is in flight — different items are
   unaffected. __pendingRows tracks optimistic task-row edits so a silent

/* ── Live Sheet fetch (public export CSV) with embedded snapshot fallback.
   The Sheet has the 17-column header (row 1); the Assignee column is
   optional — columns are matched by header name. ── */
function parseCSV(t){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(ch!=='\r') cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function normH(h){ return (h||'').toUpperCase().replace(/[\s.\-]/g,''); }
function pNum(v){ v=(v||'').toString().replace(/,/g,'').replace(/ /g,'').trim(); if(!v) return 0;
  const n=parseFloat(v); return isNaN(n)?0:n; }
function pPct(v){ v=(v||'').toString().replace('%','').trim(); const n=parseFloat(v); return isNaN(n)?0:n; }
/* ── v10.61: the owner renamed status "Writing" to "Wating" (his spelling).
   The Sheet and old STATUS_LOG rows still store "Writing" — normalize at
   the data boundary so old rows keep working; writes always send "Wating". ── */
function normStatus(s){ const v=String(s||'').trim(); const k=v.toLowerCase();
  /* v10.69: Open is gone — old stored 'Open' rows (Sheet, STATUS_LOG,
     snapshot) render as In Progress; writes never send 'Open'. */
  if(k==='writing') return 'Wating';
  if(k==='open') return 'In Progress';
  return v; }
function rowsFromCSV(raw){
  if(!raw.length) return [];
  const header=raw[0].map(normH);
  const ix={}; header.forEach((h,i)=>{ ix[h]=i; });
  const col=(r, names)=>{ for(const n of names){ const k=normH(n); if(k in ix && ix[k]<r.length) return (r[ix[k]]||'').trim(); } return ''; };
  const out=[];
  for(let i=1;i<raw.length;i++){ const r=raw[i];
    if(!r || !r.some(c=>(c||'').trim())) continue;
    const name=col(r, ['Task']);
    const unit=col(r, ['Unit']);
    if(!name && !unit) continue;
    out.push({ sl: col(r, ['SL']), unit: canonUnit(col(r, ['Unit'])), name, status: normStatus(col(r, ['Status'])) || 'In Progress',
      assignee: col(r, ['Assignee']), priority: col(r, ['Priority']),
      bst: col(r, ['Budget Status']),
      matst: col(r, ['Materials Status']),
      start: col(r, ['Start Date']), due: col(r, ['Due Date']),
      revised: col(r, ['Revised Finish Date', 'Finish Date']), finishwork: col(r, ['Finish Work']),
      prog: pPct(col(r, ['Progress'])),
      cost: pNum(col(r, ['Tentative Cost (BDT)'])), disb: pNum(col(r, ['Payment (BDT)'])),
      subtasks: pNum(col(r, ['Subtasks'])), comment: col(r, ['Latest Comment']),
      comment_by: '', comment_date: '', desc: col(r, ['Description']),
      task_id: col(r, ['Task ID']), prog_note: '' });
  }

}

            const c=byKey.get(String(r.sl)+'|'+r.unit); if(!c) return;

  if(st&&(!silent||boot)) st.textContent=T('liveFetching');
  if(!silent&&!boot) showSkeleton();
  try{
    const res=await fetch(SHEET_CSV_URL+'&cb='+Date.now());
    if(!res.ok) throw new Error('fetch '+res.status);
    const raw=parseCSV(await res.text());
    let rows=rowsFromCSV(raw);

       too — a DGL-1 login sees only DGL-1 rows, never other units'. */
    const au=allowedUnit();

    if(!rows.length){ if(st) st.textContent=T('liveEmpty'); render(); if(btn) btn.disabled=false; return; }
    D.rows=rows;

    STATUSES_ALL.forEach(s=>{ if(!D.statuses.includes(s)) D.statuses.push(s); });

    if(silent){ toast(T('liveSilentFail'),'err'); }

    render();
  }

async function loadLc(){
  const r=rowBySl(dtRn); if(!r) return;
  const sl=String(r.sl);
  if(!scriptUrl()){ lcState[sl]='guest'; return; }
  if(!curToken()){ lcState[sl]='guest'; return; }
  lcState[sl]='loading';
  try{
    const res=await fetch(scriptUrl()+'?'+new URLSearchParams({action:'getlc',token:curToken(),cb:Date.now()}),{redirect:'follow'});
    const j=await res.json();
    if(!(j&&j.ok&&Array.isArray(j.rows))) throw new Error((j&&j.error)||'getlc failed');
    const fresh=j.rows.filter(x=>String(x.sl)===sl);
    /* v10.38 pattern: keep optimistic local rows the server has not
       returned yet — deduped by MACHINE TYPE + S.L. NO. */
    const pending=lcRowsFor(sl).filter(x=>x.local && !fresh.some(f=>String(f.machineType||'').trim().toLowerCase()===String(x.machineType||'').trim().toLowerCase() && String(f.slNo||'')===String(x.slNo||'')));
    lcBySl[sl]=fresh.concat(pending);
    lcState[sl]='ready';
  }catch(e){ if(lcState[sl]==='loading') lcState[sl]='failed'; }
  if(String(dtRn)!==sl) return;
  wfRefresh();
  const lm=document.getElementById('lcModal');
  if(lm&&lm.style.display==='flex') lcRender();
}

async function lcSave(){
  const r=rowBySl(dtRn); if(!r) return;
  if(!canLcWrite(r)){ toast(isStepMode()?stepNoteText():T('lcGuestNote'),'err'); return; }
  const vals={};
  LC_FIELDS.forEach(fd=>{ vals[fd.k]=((document.getElementById('lcF_'+fd.k)||{}).value||'').trim(); });
  const m=document.getElementById('lcMsg');
  const say=(t,c)=>{ if(m){ m.textContent=t; m.className='fsmsg '+(c||''); } };
  if(!vals.machineType){ say(T('lcMachineRequired'),'err'); return; }
  const url=scriptUrl(), tok=curToken();
  if(!url||!tok){ say(T('msgNoScript'),'err'); return; }
  const isNew=dtLcEdit==='new';
  const rowNo=isNew?null:dtLcEdit;
  const key='lcSave:'+r.sl+':'+(isNew?'new':rowNo);
  if(!bgGuard(key)) return;
  const sl=String(r.sl);
  if(isNew){
    const local=Object.assign({sl,unit:r.unit,task:r.name,local:true},vals);
    lcBySl[sl]=lcRowsFor(sl).concat([local]);
    dtLcEdit=null; lcRender(); wfRefresh(); toast(T('lcSaved'),'ok');
    const q=new URLSearchParams({token:tok,action:'addlc',sl,unit:r.unit,task:r.name});
    LC_FIELDS.forEach(fd=>q.set(fd.k,vals[fd.k]));
    bgWrite(url,q,
      ()=>{ bgRelease(key); loadLc(); },
      (e)=>{ bgRelease(key); lcBySl[sl]=lcRowsFor(sl).filter(x=>x!==local); lcRender(); wfRefresh(); say(Tf('msgSaveFail',{e:e.message}),'err'); bgFailToast(e); });
  } else {
    const live=lcRowsFor(sl).find(x=>x.row===rowNo); if(!live){ bgRelease(key); return; }
    const prev=Object.assign({},live);
    Object.assign(live,vals);
    dtLcEdit=null; lcRender(); wfRefresh(); toast(T('lcSaved'),'ok');
    const q=new URLSearchParams({token:tok,action:'editlc',sl,unit:r.unit,task:r.name,row:String(rowNo)});
    LC_FIELDS.forEach(fd=>q.set(fd.k,vals[fd.k]));
    bgWrite(url,q,
      ()=>{ bgRelease(key); loadLc(); },
      (e)=>{ bgRelease(key); const t=lcRowsFor(sl).find(x=>x.row===rowNo)||live; Object.assign(t,prev); lcRender(); wfRefresh(); say(Tf('msgSaveFail',{e:e.message}),'err'); bgFailToast(e); });
  }
}
async function lcDel(row){

  const sl=String(r.sl);
  const rows=lcRowsFor(sl);
  const target=rows.find(x=>x.row===row); if(!target||target.local) return;
  const idx=rows.indexOf(target);

/* ── v10: Stage History — how a task moved through the stages, and how long
   each stage lasted. The server logs every status change (STATUS_LOG tab);
   without a script (or before any change) the timeline is seeded from the
   task's Start Date and labelled as such — never presented as a log. ── */
let dtStageLog=[], dtStageState='idle';
/* ── v10.18: the dates that close a task's loop — the date it completed
   (Finish Work first, else the Revised Finish Date) and its End Date
   (Finish Work, else Revised Finish, else Due). ── */
function compDateOf(r){ return parseD(r.finishwork) || parseD(r.revised) || null; }
function endDateOf(r){ return parseD(r.finishwork) || parseD(r.revised) || parseD(r.due) || null; }
function stageInfo(r){
  if(dtStageLog.length){
    const last=dtStageLog[dtStageLog.length-1];
    const since=parseD(last.date);
    const days=since?Math.max(0,Math.floor((todayMid()-since)/86400000)):0;
    return {since:last.date, days, seeded:false};
  }
  /* v10.18: a Complete task has NOT been "Completed" since its start date —
     it completed on its Finish Work / Revised Finish date. */
  if((r.status||'').toLowerCase()==='complete'){
    const comp=compDateOf(r);
    if(comp) return {since:r.finishwork||r.revised, days:Math.max(0,Math.floor((todayMid()-comp)/86400000)), seeded:true};
  }
  const el=daysElapsed(r);
  return {since:r.start, days:el===null?0:el, seeded:true};
}
function stageHeadHtml(r){ const s=stageInfo(r);
  return `<div id="dtStageHead" style="font-size:12px;color:var(--muted);margin-top:4px">${esc(r.status)} · ${Tf('stInStage',{n:fmtN(s.days)})}</div>`;
}
/* ── v10.10: one shared subtask meta line — start date, end date and days
   taken (done) or pending days (open). Used by the subtask list and by
   Stage History, so both always agree. ── */
function subMeta(s){
  const created=parseD(s.created||'');
  const doneD=parseD(s.doneDate||'');
  const dueD=parseD(s.due||'');
  if(s.done){
    const parts=[];
    if(created) parts.push(Tf('stSubStarted',{d:fmtD(s.created)}));
    if(doneD) parts.push(Tf('stSubFinished',{d:fmtD(s.doneDate)}));
    if(created&&doneD){ const n=Math.max(0,Math.floor((doneD-created)/86400000)); parts.push(n===0?T('stSubSameDay'):Tf('stSubTook',{n:fmtN(n)})); }
    return parts.join(' · ')||T('stSubDoneWord');
  }
  const parts=[];
  if(created){ const n=Math.max(0,Math.floor((todayMid()-created)/86400000)); parts.push(Tf('stSubStarted',{d:fmtD(s.created)})); parts.push(n===0?T('stSubToday'):Tf('stSubPending',{n:fmtN(n)})); }
  /* v10.16: days-over vs the end date — shown whenever the end date has
     passed, whether or not a start date is recorded. */
  if(dueD){ parts.push(Tf('stSubDue',{d:fmtD(s.due)})); const m=Math.floor((todayMid()-dueD)/86400000); if(m>0) parts.push(Tf('stSubOverdue',{n:fmtN(m)})); }
  if(!created&&!dueD) parts.push(T('stSubNoStart'));
  return parts.join(' · ');
}
/* ── v10.34: each workflow block collapses independently — one stored
   state per section per task (wfCollapsed_<sl>_approval / _after /
   _custom). Default expanded; collapsing one task or one section never
   affects another. The collapsed class lives on each block's wrapper
   OUTSIDE its body div, so wfRefresh() never wipes it; stageBodyHtml()
   re-reads the stored state whenever Stage History is re-rendered.
   (The v10.31 single key wfCollapsed_<sl> is no longer read.) ── */
function wfSecSuffix(sec){ return sec==='approval'?'A':sec==='after'?'B':'C'; }
function wfIsCollapsedSec(sl,sec){ try{ return localStorage.getItem('wfCollapsed_'+String(sl)+'_'+sec)==='1'; }catch(e){ return false; } }
function wfToggleCollapseSec(sec){
  const r=rowBySl(dtRn); if(!r) return;
  const c=!wfIsCollapsedSec(r.sl,sec);
  try{ localStorage.setItem('wfCollapsed_'+String(r.sl)+'_'+sec, c?'1':'0'); }catch(e){}
  wfApplyCollapseSec(sec);
}
function wfApplyCollapseSec(sec){
  const wrap=document.getElementById('dtStageWfWrap'+wfSecSuffix(sec)); if(!wrap) return;
  const r=rowBySl(dtRn); const c=r?wfIsCollapsedSec(r.sl,sec):false;
  wrap.classList.toggle('wf-collapsed',c);

/* v10.34: the Workflow Steps block is three separate blocks stacked
   vertically — Approval Process, After Approval Process, Custom /
   Earlier Steps — each with its own collapsible header and counter, and
   the two fixed sections each with their own Print button. The Add Step

/* ── v10.69: Stage History is one journey — Started → In Progress
   (Approval + After Approval steps + Subtasks inside) → Work Done.
   The three workflow blocks keep their
   ids (dtStageWfWrapA/B/C, dtStageWfBodyA/B/C, dtWfCountA/B/C,
   dtWfChevA/B/C) and the Add Step form keeps its id (dtStageWfForm),
   so wfRefresh() still rewrites the bodies on every workflow
   load/add/edit/delete — the headings and the form live OUTSIDE the
   per-block body divs, and anything inside them would be wiped.
   The subtask checklist (subBodyHtml, id dtSubBody) now lives inside

     the phase rule (v10.39) is untouched — this is display only. The

       seeded view, so both views always open with it. ── */
    /* ── v10.69: the log rows are grouped by destination stage in

       instead of raw chronological order. (Open is gone: old rows
       that ended in Open are normalized to In Progress on load, so
       they group under In Progress.) Each stage group shows only its

    const legacy=(n>=1 && n<=WF_STEPS.length) || WF_RETIRED.some(x=>wfNormName(x)===wfNormName(nm));

/* v10.82: no Delivery Date yet — count from Received to TODAY (live).

   Received column shows (wfReceivedRaw). Future Received or no Received
   shows '—' (never a negative number). Today is the real current date
   (todayMid, browser local date) — NOT the frozen snapshot date. */
function wfDaysText(model, idx){
  const row=model[idx].row; if(!row) return '—';
  if(!parseD(row.date||'')){
    const recv=parseD(wfReceivedRaw(model, idx));
    if(!recv) return '—';
    const n=Math.floor((todayMid()-recv)/86400000);
    if(n<0) return '—';
    return n===0?T('stSubSameDay'):Tf('wfDaysN',{n:fmtN(n)});
  }
  const d=row.days;
  if(d!==undefined && d!==null && d!=='' && !isNaN(Number(d))){ const n=Math.max(0,Math.round(Number(d))); return n===0?T('stSubSameDay'):Tf('wfDaysN',{n:fmtN(n)}); }
  let prev=null;
  for(let j=idx-1;j>=0;j--){ const pd=parseD((model[j].row||{}).date||''); if(pd){ prev=pd; break; } }
  if(!prev) return '—';
  const n=Math.max(0,Math.floor((parseD(row.date)-prev)/86400000));
  return n===0?T('stSubSameDay'):Tf('wfDaysN',{n:fmtN(n)});

function wfReceivedIso(model, idx){

/* v10.34: each block's header carries its own counter — "Approval
   Process: n / 12" / "After Approval Process: n / 12" (v10.40) — so it
   stays visible while that block is collapsed. The old combined
   "Workflow: n / 21 + N custom + N earlier" counter is gone. */
function wfSecCounterHtml(sec){
  const model=wfModel();
  const list=model.filter(m=>!m.custom&&((sec===0&&m.no<=WF_SECTIONS[0].steps.length)||(sec===1&&m.no>WF_SECTIONS[0].steps.length)));
  const done=list.filter(m=>m.row&&parseD(m.row.date||'')).length;
  return `<b>${esc(WF_SECTIONS[sec].name)}: ${fmtN(done)} / ${fmtN(list.length)}</b>`;
}
/* v10.34: one table per block. `which` is 0 (steps 1–12), 1 (steps 13–24)
   or 'custom' (custom + earlier rows). The in-table section header rows
   are gone — each block carries its own header above the table. Received
   Date / Days are still computed against the FULL model (idx is the
   full-model index), so step 13's Received still comes from step 12. */
function wfTableHtml(r,which){
  const canE=canEditUnit(r.unit);
  /* v10.69: in step mode the holder edits ONLY their own step row — every
     other row is read-only and never shows edit/delete buttons. */
  const canStep=m=>isStepMode()&&myStepNo()===m.no;
  const canRow=m=>canE||canStep(m);
  const model=wfModel();
  if(dtWfState==='loading'){ return `<div style="font-size:13px;color:var(--muted)">${T('wfLoading')}</div>`; }
  const rows=model.filter(m=>which==='custom'?m.custom:!m.custom&&((which===0&&m.no<=WF_SECTIONS[0].steps.length)||(which===1&&m.no>WF_SECTIONS[0].steps.length)));
  const parts=rows.map((m)=>{
    const idx=model.indexOf(m);
    const w=m.row, dated=w&&parseD(w.date||'');
    if(canRow(m)&&dtWfEdit===m.no){
      const nameCell=m.custom?`<input type="text" id="wfEName" class="efinput" style="min-width:140px" value="${esc(m.name)}">`:esc(m.name);
      return `<tr class="wf-done"><td class="wfstep-no">${m.no}</td><td>${nameCell}</td><td><input type="text" id="wfEWho" class="efinput" style="min-width:110px" value="${esc(w.who||'')}"></td><td><input type="date" id="wfERecv" class="efinput" style="max-width:150px" value="${toISODate(wfReceivedRaw(model,idx))}" oninput="wfEditDaysLive()"></td><td id="wfEDays">${wfDaysBetween(wfReceivedRaw(model,idx), w.date||'')}</td><td><input type="date" id="wfEDate" class="efinput" style="max-width:150px" value="${toISODate(w.date||'')}" oninput="wfEditDaysLive()"></td><td><input type="text" id="wfERef" class="efinput" style="min-width:110px" value="${esc(w.ref||'')}"></td><td style="white-space:nowrap"><button class="entrybtn" onclick="wfSaveEdit(${m.no})">${T('stSave')}</button> <button class="entrybtn off" onclick="wfCancelEdit()">${T('cfCancel')}</button></td></tr>`;
    }
    const acts=canRow(m)&&w?`<button class="subedit" title="${T('wfEdit')}" onclick="wfEdit(${m.no})">✏️</button><button class="subdel" title="${T('wfDel')}" onclick="wfDel(${m.no})">✕</button>`:'';
    return `<tr class="${dated?'wf-done':'wf-pending'}"><td class="wfstep-no">${m.no}</td><td>${esc(m.name)}${m.legacy?` <span style="font-size:11px;color:var(--muted)">(${T('wfLegacy')})</span>`:m.custom?` <span style="font-size:11px;color:var(--muted)">(${T('wfCustom').replace('…','')})</span>`:''}${w&&w.local?` <span style="font-size:11px;color:var(--muted)">(${T('wfPending')})</span>`:''}</td><td>${w&&w.who?esc(w.who):'—'}</td><td>${wfReceivedText(model,idx)}</td><td>${wfDaysText(model,idx)}</td><td>${dated?fmtD(w.date):'—'}</td><td>${w&&w.ref?esc(w.ref):'—'}</td>${(canE||isStepMode())?`<td style="white-space:nowrap">${acts}</td>`:''}</tr>`;
  });
  /* v10.70: LC row — clickable, between step 22 and 23 in section B only.
     It is NOT a chain step (no number, no dates, no workflow behavior). */
  if(which===1){ const i22=rows.findIndex(m=>m.no===22); if(i22>=0) parts.splice(i22+1,0,lcRowHtml(r)); }
  return `<div class="wfscroll"><table class="wftable"><tr><th>#</th><th>${T('wfStep')}</th><th>${T('wfWho')}</th><th>${T('wfReceived')}</th><th>${T('wfDays')}</th><th>${T('wfDate')}</th><th>${T('wfRef')}</th>${(canE||isStepMode())?'<th></th>':''}</tr>`+parts.join('')+`</table></div>`;
}
/* v10.34: the Add Step form is ONE shared form below all three blocks
   (it is not duplicated per section). It is re-rendered by wfRefresh()
   so the dropdown always lists the fixed steps still pending. */
function wfAddFormHtml(r){
  const canE=canEditUnit(r.unit);
  /* v10.69: a step token sees ONLY their own step in this form — and only
     while it is still pending (no custom steps). Once their step is done
     the form hides. */
  if(isStepMode()){
    if(dtWfState==='loading') return '';
    const model=wfModel();
    const mine=model.find(m=>!m.custom&&m.no===myStepNo());
    if(!mine||(mine.row&&parseD(mine.row.date||''))) return '';
    const recvDef=wfReceivedIso(model, model.findIndex(m=>m.no===mine.no));
    return `<div class="wfadd"><select id="wfStepSel" class="efinput"><option value="${mine.no}">${mine.no}. ${esc(mine.name)}</option></select><input type="text" id="wfWho" class="efinput" placeholder="${T('wfWhoPh')}" oninput="window.__wfFormTouched=true"><input type="date" id="wfRecv" class="efinput" value="${toISODate(recvDef)}" oninput="window.__wfFormTouched=true"><input type="date" id="wfDate" class="efinput" value="${toISODate(todayMid())}" oninput="window.__wfFormTouched=true"><input type="text" id="wfRef" class="efinput" placeholder="${T('wfRefPh')}" oninput="window.__wfFormTouched=true"><button class="entrybtn" onclick="wfAdd()">${T('wfAddStep')}</button></div><div id="wfMsg" class="fsmsg" style="padding:6px 0"></div>`;
  }
  if(!canE||dtWfState==='loading') return '';
  const model=wfModel();
  const pending=model.filter(m=>!m.custom && !(m.row&&parseD(m.row.date||'')));
  let h='';
  if(!scriptUrl()||!curToken()) h+=`<div style="font-size:12.5px;color:var(--muted);margin-top:8px">${T('wfGuestNote')}</div>`;
  if(!pending.length){ h+=`<div style="font-size:13px;color:var(--muted);margin-top:8px">${T('wfAllDone')}</div>`; }
  /* v10.67: Received defaults to the first pending step's predecessor delivery. */
  const recvDef=pending.length?wfReceivedIso(model, model.findIndex(m=>m.no===pending[0].no)):'';
  h+=`<div class="wfadd"><select id="wfStepSel" class="efinput" onchange="wfStepSelChange()">${pending.map(m=>`<option value="${m.no}">${m.no}. ${esc(m.name)}</option>`).join('')}<option value="custom">${esc(T('wfCustom'))}</option></select><input type="text" id="wfCustomName" class="efinput" placeholder="${T('wfCustomPh')}" style="display:${pending.length?'none':''}" oninput="window.__wfFormTouched=true"><input type="text" id="wfWho" class="efinput" placeholder="${T('wfWhoPh')}" oninput="window.__wfFormTouched=true"><input type="date" id="wfRecv" class="efinput" value="${toISODate(recvDef)}" oninput="window.__wfFormTouched=true"><input type="date" id="wfDate" class="efinput" value="${toISODate(todayMid())}" oninput="window.__wfFormTouched=true"><input type="text" id="wfRef" class="efinput" placeholder="${T('wfRefPh')}" oninput="window.__wfFormTouched=true"><button class="entrybtn" onclick="wfAdd()">${T('wfAddStep')}</button></div><div id="wfMsg" class="fsmsg" style="padding:6px 0"></div>`;
  return h;
}
function wfStepSelChange(){
  window.__wfFormTouched=true;
  const sel=document.getElementById('wfStepSel'), inp=document.getElementById('wfCustomName');
  if(sel&&inp) inp.style.display=(sel.value==='custom')?'':'none';
  /* v10.67: Received follows the selected step's predecessor delivery. */
  const rv=document.getElementById('wfRecv');
  if(rv&&sel&&sel.value!=='custom'){
    const model=wfModel(); const idx=model.findIndex(m=>m.no===parseInt(sel.value,10));
    if(idx>=0) rv.value=toISODate(wfReceivedIso(model,idx));
  }
}
/* v10.28: next free CUSTOM step number — max(25, maxExistingStepNo + 1),
   where maxExistingStepNo is the max stepno across all current workflow
   rows (server rows + local preview rows, fixed and custom). wfModel()
   already normalises every row to a number (fixed names map to 1–24,
   nameless customs get the next free number), and always lists the 24
   fixed steps, so max(model nos) >= 24 and the result is always >= 25.
   Never send a custom add without a stepno: the server's max+1
   auto-assign would give stepno 3 when only fixed steps 1–2 exist. */
function wfNextCustomNo(){
  return Math.max(WF_STEPS.length, ...wfModel().map(m=>m.no)) + 1;
}
/* ── v10.69: phase-derived Status — Open is gone, so the phase rule is
   now one line: every task is In Progress unless Complete / Wating
   (manual). A workflow ADD reopens a Complete / Wating task to
   In Progress (the owner's 2026-11-19 decision — a new step means work
   is under way again); a workflow DELETE never reopens one. An
   In Progress task never changes. wfPhase() is kept for shape: it
   returns 'B' when the task has any workflow row at all (fixed,
   earlier or custom — any row means work is in progress). ── */
function wfPhase(){
  return wfModel().some(m=>m.row)?'B':null;
}
/* The status the phase rule wants for this task, or null when no change
   applies. reopen=true (workflow ADD): a Complete / Wating task with at
   least one workflow row reopens to In Progress; reopen=false (workflow
   DELETE): Complete / Wating never move. An In Progress task never
   moves either way; any other status becomes In Progress. */
function wfPhaseStatus(r, reopen){
  const cur=(r.status||'').toLowerCase();
  if(cur==='in progress') return null;
  if(cur==='complete'||cur==='wating') return (reopen!==false&&wfPhase())?'In Progress':null;
  return 'In Progress';
}
/* Status-only update — v4.14 writes only the fields sent and logs the
   change into Stage History when the status actually changed. If the
   local status moved again while this write was in flight (a second step
   added meanwhile), the newer status is sent right after, so the Sheet
   always ends on the latest phase — never on a stale one. */
function wfWriteStatus(r, want, onOk, onFail){
  const q=new URLSearchParams({token:curToken(),action:'update',sl:String(r.sl),unit:r.unit,name:r.name,status:want});
  bgWrite(scriptUrl(),q,
    ()=>{ const live=rowBySl(r.sl);
      if(live&&(live.status||'')!==want) wfWriteStatus(live,live.status,onOk,onFail);
      else if(onOk) onOk(); },
    onFail);
}
/* Apply a phase-derived status flip locally at once (v10.38 optimistic
   pattern): patch the row, protect it from a silent refresh landing
   mid-write, and re-render list / board / KPIs / filters plus the open
   detail (its status chip). Returns the previous status, or null when
   the rule wants no change. The caller sends the write. */
function wfApplyPhaseStatus(r){
  const want=wfPhaseStatus(r); if(!want) return null;
  const prev=r.status; r.status=want;
  __trackPending(String(r.sl),{status:want});
  render(); renderDetail();
  return prev;
}
/* Undo a local phase-status flip (on a failed write): restore the
   previous status, but only if nothing newer superseded it meanwhile. */
function wfUndoPhaseStatus(r, prev, want){
  if(!want) return;
  __untrackPending(String(r.sl));
  const live=rowBySl(r.sl)||r;
  if((live.status||'')===want) live.status=prev;
  render(); renderDetail();
}
function wfRefresh(){ const r=rowBySl(dtRn); if(!r) return;
  /* v10.34: refresh all three block bodies, all three counters, the
     custom block's visibility and the shared Add Step form. Counters
     live outside the bodies, so they stay visible while a block is
     collapsed. */
  const set=(id,html)=>{ const el=document.getElementById(id); if(el) el.innerHTML=html; };
  set('dtStageWfBodyA',wfTableHtml(r,0));
  set('dtStageWfBodyB',wfTableHtml(r,1));
  set('dtStageWfBodyC',wfTableHtml(r,'custom'));
  set('dtWfCountA',wfSecCounterHtml(0));
  set('dtWfCountB',wfSecCounterHtml(1));
  const cw=document.getElementById('dtStageWfWrapC');
  if(cw){ const has=wfModel().some(m=>m.custom); cw.style.display=has?'':'none'; if(has) set('dtWfCountC',wfCustomCountHtml()); }
  set('dtStageWfForm',wfAddFormHtml(r)); }
/* ── v10.43: "Last Workflow" column — the latest workflow step per task
   (from the script's getlastworkflow action, v4.15) + how many days it
   has been sitting there + the next chain step. Loaded once after login
   and re-fetched on every silent background refresh; workflow adds /
   deletes update the map optimistically at once (v10.38 pattern). If
   the action is missing (pre-v4.15 script) or fails, the column shows
   "—" and nothing else breaks — no toast, no retry loop. ── */
let lastWfMap={};
function lwDaysAgo(dateStr){ const d=parseD(dateStr||''); if(!d) return null;
  return Math.max(0, Math.floor((todayMid()-d)/86400000)); }
/* Next chain step after the last one, by NAME (never by stored stepno —
   the chain was renumbered in v10.40). Returns the next step name, the
   string 'ALLDONE' when the last chain step (24) is the last one, or
   null when the last step is custom / earlier or the next step cannot
   be determined — never guess. */
function lwNext(entry){
  const nm=String(entry.step||'').trim();
  const i=nm?WF_STEPS.findIndex(s=>wfNormName(s)===wfNormName(nm)):-1;
  if(i<0) return null;
  if(i>=WF_STEPS.length-1) return 'ALLDONE';
  return WF_STEPS[i+1];
}
/* Latest of a task's workflow rows: greatest date wins, ties break to
   the later sheet row (later appended wins); a local preview row (no
   sheet row number yet) wins ties — it was just added. */
function lwLatest(rows){
  let best=null;
  (rows||[]).forEach(w=>{
    if(!w||!String(w.step||'').trim()) return;
    if(!best){ best=w; return; }
    const dNew=String(w.date||''), dCur=String(best.date||'');
    const rNew=(w.row!==undefined&&w.row!==null&&w.row!=='')?Number(w.row):1e9;
    const rCur=(best.row!==undefined&&best.row!==null&&best.row!=='')?Number(best.row):1e9;
    if(dNew>dCur||(dNew===dCur&&rNew>rCur)) best=w;
  });
  return best;
}
/* Optimistic set: a newly added step becomes the last one only when its
   date is at least as recent as the current last step's (a backdated
   step never jumps the queue). Returns the previous entry (for rollback). */
function lwSetFromRow(sl, row){
  const key=String(sl);
  const prev=lastWfMap[key]||null;
  const dNew=String((row&&row.date)||''), dCur=String((prev&&prev.date)||'');
  if(!prev||dNew>=dCur) lastWfMap[key]={sl:key,unit:row.unit||'',task:row.task||'',stepno:row.stepno,step:row.step,who:row.who||'',date:row.date||''};
  return prev;
}
function lwRestore(sl, prev){
  const key=String(sl);
  if(prev) lastWfMap[key]=prev; else delete lastWfMap[key];
}
/* Recompute one task's last step from the detail's workflow rows
   (server + local preview rows) — used after a delete or an edit. */
function lwRecomputeFromRows(sl){
  const key=String(sl);
  const rows=wfRows().filter(w=>String(w.sl)===key);
  const best=lwLatest(rows);
  if(best) lastWfMap[key]={sl:key,unit:best.unit||'',task:best.task||'',stepno:best.stepno,step:best.step,who:best.who||'',date:best.date||''};
  else delete lastWfMap[key];
}
async function loadLastWf(quiet){
  if(!scriptUrl()||!curToken()) return;
  try{
    const res=await fetch(scriptUrl()+'?'+new URLSearchParams({action:'getlastworkflow',token:curToken(),cb:Date.now()}),{redirect:'follow'});
    const j=await res.json();
    if(!j||!j.ok||!Array.isArray(j.items)) throw new Error((j&&j.error)||'getlastworkflow failed');
    const m={};
    j.items.forEach(it=>{ if(it&&it.sl!==undefined&&it.sl!==null&&String(it.sl)!==''&&String(it.step||'').trim()) m[String(it.sl)]={sl:String(it.sl),unit:it.unit||'',task:it.task||'',stepno:it.stepno,step:it.step,who:it.who||'',date:it.date||''}; });
    lastWfMap=m;
  }catch(e){ lastWfMap={}; }
  render();
}
function lastWfCell(r){
  /* v10.44: a Complete task shows just "Complete" — no step, who, days or
     next step, even when it has no workflow rows at all. */
  if((r.status||'').toLowerCase()==='complete') return '<div class="lw-done" title="Complete">Complete</div>';
  const e=lastWfMap[String(r.sl)];
  if(!e) return '—';
  const step=String(e.step||'').trim();
  if(!step) return '—';
  const n=lwDaysAgo(e.date);
  const who=String(e.who||'').trim();
  const agoTxt=n===null?'':(n===0?T('lwToday'):n===1?T('lwAgo1'):Tf('lwAgo',{n:fmtN(n)}));
  const next=lwNext(e);
  const tip=step+(who?' — '+who:'')+(agoTxt?' · '+agoTxt:'')+(next==='ALLDONE'?' · '+T('lwAllDone'):next?' → '+next:'');
  let sub='';
  if(who||agoTxt||next){
    sub='<div class="lwsub">'+(who?esc(who)+' · ':'')+(agoTxt?'<span class="'+(n!==null&&n>=7?'lw-old':'')+'">'+esc(agoTxt)+'</span>':'')+(next==='ALLDONE'?' · '+esc(T('lwAllDone')):next?' → '+esc(next):'')+'</div>';
  }
  return '<div title="'+esc(tip)+'"><div class="lwstep">'+esc(step)+'</div>'+sub+'</div>';
}
async function loadWorkflow(quiet){
  const r=rowBySl(dtRn); if(!r) return;
  if(!scriptUrl()){ dtWfState='idle'; wfRefresh(); return; }
  if(!quiet){ dtWfState='loading'; wfRefresh(); }
  try{
    const res=await fetch(scriptUrl()+'?'+new URLSearchParams({action:'getworkflow',token:curToken(),sl:String(r.sl),unit:r.unit,cb:Date.now()}),{redirect:'follow'});
    const j=await res.json();
    const arr=(j&&(Array.isArray(j.rows)?j.rows:Array.isArray(j.workflow)?j.workflow:Array.isArray(j.steps)?j.steps:[]));
    dtWf=arr.filter(w=>String(w.sl)===String(r.sl));
  }catch(e){ dtWf=[]; }
  dtWfState='idle'; wfRefresh();
}
/* v10.50: the script (v4.15) rejects a step by NUMBER, so a fixed step
   whose name was never recorded can still fail when an OLDER row already
   holds its number — e.g. step 1 "APPROVEED BY CEO (PROJECT/BUDGET/CS)"
   vs a legacy "PREPARED BY" row recorded under stepno 1. The form
   correctly still offers that step (disabling it by number would hide it
   forever), so on a duplicate error we name the old entry that blocks it
   instead. v4.16 (name-based duplicate check) will unblock the add.
   Returns the specific message, or null when the plain error should stay
   (the step name is already recorded, or no legacy row holds this number). */
function wfDupBlockerMsg(no, step){
  const model=wfModel();
  const fixed=model.find(m=>!m.custom && m.no===no);
  if(fixed && fixed.row) return null; /* name already recorded: plain error */
  const old=model.find(m=>m.custom && m.legacy && m.row && parseInt(m.row.stepno,10)===no);
  if(!old) return null;
  const nm=String((old.row&&old.row.step)||old.name||'').trim();
  const who=String((old.row&&old.row.who)||'').trim();
  const dt=(old.row&&old.row.date)?fmtD(old.row.date):'';
  const det='"'+nm+'"'+(who?' — '+who:'')+(dt?', '+dt:'');
  return 'Step No '+String(no)+' is already used by an earlier entry — '+det+'. That old entry holds this step number, so "'+step+'" cannot be saved yet; a script update will unblock it.';
}
async function wfAdd(){
  const r=rowBySl(dtRn); if(!r) return;
  const sel=document.getElementById('wfStepSel'); if(!sel) return;
  const msg=document.getElementById('wfMsg');
  const say=(t)=>{ if(msg){ msg.textContent=t; msg.className='fsmsg err'; } toast(t,'err'); };
  const isCustom=sel.value==='custom';
  let no=null, step='';
  if(isCustom){
    step=((document.getElementById('wfCustomName')||{}).value||'').trim();
    if(!step){ say(T('wfCustomPh')); return; }
    /* Duplicate custom name — blocked client-side (the server does not
       reject duplicate step names, only duplicate step numbers). */
    if(wfModel().some(m=>wfNormName(m.name)===wfNormName(step))){ say(T('wfCustomDup')); return; }
  }else{
    no=parseInt(sel.value,10);
    step=WF_STEPS[no-1];
  }
  const who=((document.getElementById('wfWho')||{}).value||'').trim();
  const date=(document.getElementById('wfDate')||{}).value||'';
  const recv=(document.getElementById('wfRecv')||{}).value||'';
  const ref=((document.getElementById('wfRef')||{}).value||'').trim();
  if(!step||!date) return;
  /* v10.69: a step token may add only their own step (the form offers
     nothing else, but never trust the form alone). */
  if(isStepMode()&&(isCustom||no!==myStepNo())){ say(T('stepNote')); return; }
  /* v10.38: double-click guard — a fast second click right after an add,
     before the user touched the rebuilt form, is an accidental
     double-click, not a second add (the rebuilt form auto-selects the
     next pending step, so without this guard a double-click would add a
     step the user never chose). */
  if(Date.now()-__wfLastAddAt<600 && !window.__wfFormTouched) return;
  __wfLastAddAt=Date.now(); window.__wfFormTouched=false;
  const url=scriptUrl(), tok=curToken();
  /* Guest / snapshot mode: local preview only — nothing is sent anywhere.
     Same numbering as the logged-in path: max(25, maxExisting + 1). */
  if(!url||!tok){
    const localG={sl:r.sl,unit:r.unit,task:r.name,stepno:isCustom?wfNextCustomNo():no,step,who,date,received:recv,ref,local:true};
    dtWfLocal.push(localG);
    /* v10.43: guest preview — the Last Workflow cell follows the
       preview step too (nothing is sent anywhere). */
    lwSetFromRow(r.sl, localG); render();
    /* v10.39: guest preview — the phase rule is previewed locally too
       (nothing is sent anywhere). */
    const wantG=wfPhaseStatus(r);
    if(wantG){ r.status=wantG; render(); renderDetail(); }
    wfRefresh(); toast(T('toastWfAddLocal'),'ok'); return;
  }
  /* v10.28: a custom step is sent WITH an explicit stepno from
     wfNextCustomNo() (25, 26, …) — v4.12 accepts an explicit stepno when
     it is positive and not a duplicate. Fixed steps send their own 1–24. */
  const stepno=isCustom?wfNextCustomNo():no;
  const key='wfAdd:'+r.sl+':'+stepno+':'+step;
  if(!bgGuard(key)) return;
  /* v10.38: optimistic — the step appears at once (as a local preview
     row tagged Pending), the Add Step form clears, and the server write
     runs in the background. On success the server rows are loaded
     (server-computed Days / Next Step Date) and the local row is
     swapped out; on failure the local row is removed and the error is
     shown. */
  const local={sl:r.sl,unit:r.unit,task:r.name,stepno,step,who,date,received:recv,ref,local:true};
  dtWfLocal.push(local);
  /* v10.43: optimistic — the Last Workflow cell follows the new step at
     once (when its date is the latest); rolled back below on failure. */
  const prevLw=lwSetFromRow(r.sl, local); render();
  /* v10.39: the new step sets the phase — flip the status at once (the
     local row above is already in the model, so the phase counts it). */

    ()=>{ dtWfLocal=dtWfLocal.filter(w=>w!==local); bgRelease(key);

         rows do not justify. Then converge (Stage History picks up the
         logged status change). */
      if(!wantStatus){ loadWorkflow(true); loadLastWf(true); return; }

        async ()=>{ __untrackPending(String(r.sl)); loadStageLog(true); await loadWorkflow(true); refreshLive(false,true); },

    (e)=>{ bgRelease(key); dtWfLocal=dtWfLocal.filter(w=>w!==local);

      lwRestore(r.sl, prevLw); render();
      /* v10.39: the step did not save — roll the status back with it

async function wfSaveEdit(no){
  const r=rowBySl(dtRn); if(!r) return;
  /* v10.27: find by stepno — model[no-1] is wrong once custom steps exist. */
  const model=wfModel(); const m=model.find(x=>x.no===no); if(!m||!m.row) return;
  if(isStepMode()&&no!==myStepNo()){ toast(T('stepNote'),'err'); return; }

  const date=(document.getElementById('wfEDate')||{}).value||'';
  const recv=(document.getElementById('wfERecv')||{}).value||'';
  const ref=((document.getElementById('wfERef')||{}).value||'').trim();
  let newName=m.name;
  if(m.custom){
    newName=((document.getElementById('wfEName')||{}).value||'').trim();
    if(!newName) return;
    if(wfNormName(newName)!==wfNormName(m.name) && model.some(x=>x!==m && wfNormName(x.name)===wfNormName(newName))){
      const mm=document.getElementById('wfMsg'); if(mm){ mm.textContent=T('wfCustomDup'); mm.className='fsmsg err'; }
      toast(T('wfCustomDup'),'err'); return;
    }
  }
  const url=scriptUrl(), tok=curToken();
  if(m.row.local){
    const t=dtWfLocal.find(w=>w===m.row)||m.row;
    if(t){ t.who=who; t.date=date; t.received=recv; t.ref=ref; if(m.custom) t.step=newName; }
    /* v10.43: the edited preview step may be the last one — recompute
       the Last Workflow cell from the remaining rows. */
    lwRecomputeFromRows(r.sl); render();
    dtWfEdit=null; wfRefresh(); toast(T('toastWfEdit'),'ok'); return;
  }
  if(!url||!tok){ toast(T('msgNoScript'),'err'); return; }
  /* v10.30: send the row's STORED stepno, not the model number — a legacy
     row's model number (>= 25) differs from its stored stepno. */
  const q=new URLSearchParams({token:tok,action:'editworkflow',sl:String(r.sl),unit:r.unit,stepno:String((m.row&&m.row.stepno)||no),who,date,received:recv,ref});
  /* v10.27: editworkflow renames a step via p.step — send the edited name
     for custom steps (fixed steps keep their canonical name). */
  if(m.custom) q.set('step',newName);
  if(m.row.row!==undefined&&m.row.row!==null&&m.row.row!=='') q.set('row',String(m.row.row));
  /* v10.38: optimistic — apply locally at once; the server write runs in
     the background and the edit is rolled back if it fails. */
  const prev={who:m.row.who,date:m.row.date,received:m.row.received,ref:m.row.ref,step:m.row.step};
  m.row.who=who; m.row.date=date; m.row.received=recv; m.row.ref=ref; if(m.custom) m.row.step=newName;
  /* v10.43: the edited step may be the last one — recompute the Last
     Workflow cell at once; the success handler converges it below. */
  lwRecomputeFromRows(r.sl); render();
  dtWfEdit=null; wfRefresh(); toast(T('toastWfEdit'),'ok');
  bgWrite(url,q,
    async ()=>{ await loadWorkflow(true); loadLastWf(true); },
    (e)=>{ const live=dtWf.find(w=>w===m.row)||dtWf.find(w=>String(w.stepno)===String(m.row.stepno))||m.row; Object.assign(live,prev); wfRefresh();
      /* v10.43: the edit did not save — recompute the cell from the
         restored rows. */
      lwRecomputeFromRows(r.sl); render();
      const mm=document.getElementById('wfMsg'); if(mm){ mm.textContent=Tf('msgSaveFail',{e:e.message}); mm.className='fsmsg err'; } bgFailToast(e); });
}
async function wfDel(no){
  const r=rowBySl(dtRn); if(!r) return;
  /* v10.27: find by stepno — model[no-1] is wrong once custom steps exist. */
  const model=wfModel(); const m=model.find(x=>x.no===no); if(!m||!m.row) return;
  if(isStepMode()&&no!==myStepNo()){ toast(T('stepNote'),'err'); return; }
  const ok=await confirmDlg(T('wfDelT'), T('wfDelB'));
  if(!ok) return;
  const url=scriptUrl(), tok=curToken();
  if(m.row.local){
    dtWfLocal=dtWfLocal.filter(w=>w!==m.row);
    /* v10.43: the deleted preview step may have been the last one —
       recompute the Last Workflow cell from the remaining rows. */
    lwRecomputeFromRows(r.sl); render();
    /* v10.39: guest/local preview — the phase is recomputed from the
       remaining steps and the status follows locally (nothing is sent). */
    const wantL=wfPhaseStatus(r,false);
    if(wantL){ r.status=wantL; render(); renderDetail(); }
    wfRefresh(); toast(T('toastWfDel'),'ok'); return;
  }
  if(!url||!tok){ toast(T('msgNoScript'),'err'); return; }
  /* v10.30: send the row's STORED stepno, not the model number (see wfSaveEdit). */
  const q=new URLSearchParams({token:tok,action:'deleteworkflow',sl:String(r.sl),unit:r.unit,stepno:String((m.row&&m.row.stepno)||no)});
  if(m.row.row!==undefined&&m.row.row!==null&&m.row.row!=='') q.set('row',String(m.row.row));
  /* v10.38: optimistic — the row disappears at once; the server delete
     runs in the background and the row is restored if it fails. */
  const rowObj=m.row;
  dtWf=dtWf.filter(w=>w!==rowObj);
  /* v10.43: optimistic — recompute the Last Workflow cell from the
     remaining steps at once; rolled back below on failure. */
  const prevLw=lastWfMap[String(r.sl)]||null;
  lwRecomputeFromRows(r.sl); render();
  /* v10.69: the remaining steps set the phase now — a delete never
     reopens a Complete / Wating task (only an add does). */
  const wantStatus=wfPhaseStatus(r,false);
  const prevStatus=wantStatus?wfApplyPhaseStatus(r):null;
  /* v10.63: name the phase flip in the toast when the delete actually
     changed the status; otherwise keep the plain toast. */
  wfRefresh(); toast(wantStatus?Tf('toastWfDelFlip',{st:wantStatus}):T('toastWfDel'),'ok');
  bgWrite(url,q,
    ()=>{ if(!wantStatus){ loadWorkflow(true); loadLastWf(true); return; }
      /* v10.39: write the phase status ONLY after the delete saved,
         then converge (Stage History picks up the logged change). */
      wfWriteStatus(r,wantStatus,
        async ()=>{ __untrackPending(String(r.sl)); loadStageLog(true); await loadWorkflow(true); refreshLive(false,true); },
        (e)=>{ wfUndoPhaseStatus(r,prevStatus,wantStatus); loadWorkflow(true);
          const mm=document.getElementById('wfMsg'); if(mm){ mm.textContent=Tf('msgSaveFail',{e:e.message}); mm.className='fsmsg err'; } bgFailToast(e); });
    },
    (e)=>{ dtWf.push(rowObj);
      /* v10.43: the delete did not save — restore the Last Workflow
         cell with the row. */
      lwRestore(r.sl, prevLw); render();
      /* v10.39: the delete did not save — restore the row and roll the
         status back with it (no status write was sent yet). */
      if(wantStatus) wfUndoPhaseStatus(r,prevStatus,wantStatus);
      wfRefresh();
      const mm=document.getElementById('wfMsg'); if(mm){ mm.textContent=Tf('msgSaveFail',{e:e.message}); mm.className='fsmsg err'; } bgFailToast(e); });
}

/* ── v10.70: Download All / Print All — every task the current login can
   see (D.rows is already login-scoped at boot / by the script), grouped by
   unit in D.units order then SL. The list's search and filters are
   deliberately ignored; the button titles say so. ── */
function allVisibleRows(){
  const order={}; (D.units||[]).forEach((u,i)=>{ order[u]=i; });
  const rows=[...D.rows];
  rows.sort((a,b)=>{ const ua=(order[a.unit]!==undefined?order[a.unit]:999), ub=(order[b.unit]!==undefined?order[b.unit]:999);
    if(ua!==ub) return ua-ub; return (parseInt(a.sl,10)||0)-(parseInt(b.sl,10)||0); });
  return rows;
}
const ALL_COLS=['SL','Unit','Task','Status','Budget Status','Materials Status','Start Date','Due Date','Finish Date','Progress','Tentative Cost (BDT)','Payment (BDT)','Latest Comment'];
function allCsvText(){
  const L=[];

}

  /* v10: the 8 canonical units are the base; any other unit label present in
     the loaded data is listed too (never silently dropped). */
  const listUnits=UNITS_ALL.concat([...new Set(D.rows.map(r=>r.unit))].filter(u=>u&&!UNITS_ALL.includes(u)));
  h+=listUnits.map(u=>`<div class="sbitem ${active===u?'act':''}" onclick="sbFilterUnit('${esc(u)}')"><span class="ic">🏭</span><span class="nm">${esc(u)}</span><span class="cnt">${counts[u]||0}</span></div>`).join('');
  el.innerHTML=h;
}
function sbFilterUnit(u){ selU=new Set([u]); buildFilters(); render(); }

/* ── v9: profile chip — shows the REAL login state from the whoami result:

function toggleSidebarCollapse(){ const l=document.getElementById('layoutEl'); if(!l) return; const c=l.classList.toggle('collapsed'); const b=document.querySelector('.wscol'); if(b){ b.textContent=c?'»':'«'; b.title=c?'Expand':'Collapse'; } }

function renderBoard(){
