function bdDragStart(ev,sl){ window.__dragSl=sl; window.__dragging=true;
  try{ ev.dataTransfer.setData('text/plain', String(sl)); ev.dataTransfer.effectAllowed='move'; }catch(e){} }
document.addEventListener('dragend', ()=>{ setTimeout(()=>{ window.__dragging=false; }, 50); });
function bdCardClick(ev,sl){ if(window.__dragging) return; openDetail(sl); }
function bdDragOver(ev){ ev.preventDefault(); ev.currentTarget.classList.add('over'); }
function bdDragLeave(ev){ ev.currentTarget.classList.remove('over'); }
function bdDrop(ev,status){ ev.preventDefault(); ev.currentTarget.classList.remove('over');
  const sl=(ev.dataTransfer && ev.dataTransfer.getData('text/plain')) || window.__dragSl;
  if(sl) moveTask(sl, status); }
function boardSay(msg, cls){ const e=document.getElementById('boardMsg'); if(e){ e.textContent=msg; e.className='fsmsg '+(cls||''); } }
async function moveTask(sl, newStatus){
  const r=rowBySl(sl); if(!r) return false;
  if((r.status||'')===newStatus) return true;
  /* v10.69: STATUS LOCK — In Progress is workflow-driven only (Open is
     gone), so a board drag to the In Progress column is blocked (the card
     stays put and the user is told why). Drags to Complete / Wating still
     work — those two stay freely editable by hand. A step token cannot
     drag at all — it edits only its own workflow step. */
  if(isStepMode()){
    boardSay(T('stepNote'),'err');
    toast(T('stepNote'),'err');
    return false;
  }
  if(newStatus==='In Progress'){
    boardSay('In Progress changes only through workflow steps — drag to Complete or Wating instead.','err');
    toast('In Progress changes only through workflow steps.','err');
    return false;
  }
  const url=scriptUrl(), tok=curToken();
  if(!url||!tok){ boardSay(T('msgNoScript'),'err'); toast(T('msgNoScript'),'err'); window.__lastMoveUrl=null; render(); return false; }
  const q=new URLSearchParams({token:tok, action:'update', sl:String(r.sl), unit:r.unit, name:r.name,
    status:newStatus, assignee:r.assignee||'', start:toISODate(r.start), due:toISODate(r.due),
    revised:toISODate(r.revised), prog:String(r.prog||0),
    cost:String(r.cost||0), payment:String(r.disb||0), comment:r.comment||''});
  const full=url+'?'+q.toString()+'&cb='+Date.now();
  window.__lastMoveUrl=full; window.__lastMoveStatus=newStatus;
  /* v10.38: optimistic — the card moves at once; the server write runs
     in the background and the card moves back if it fails. */
  const prevStatus=r.status;
  r.status=newStatus;
  __trackPending(String(r.sl),{status:newStatus});
  boardSay(T('msgSaved'),'ok'); toast(T('toastStatus'),'ok'); render();
  bgWrite(url,q,
    ()=>{ __untrackPending(String(r.sl)); refreshLive(false,true); },
    (e)=>{ const live=rowBySl(sl)||r; live.status=prevStatus; __untrackPending(String(r.sl)); boardSay(Tf('msgSaveFail',{e:e.message}),'err'); bgFailToast(e); render(); });
  return true;
}
window.__moveTask=moveTask;
/* ── Calendar: tasks as chips on their deadline date; no-date list below. ── */
let calY=null, calM=null;
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function calInit(){ if(calY===null){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); } }
function calShift(d){ calInit(); calM+=d; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} renderCal(); }
function calToday(){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); renderCal(); }
window.__setCal=function(y,m){ calY=y; calM=m; renderCal(); };
function renderCal(){
  calInit();
  const g=document.getElementById('calGrid'); if(!g) return;
  const t=document.getElementById('calTitle'); if(t) t.textContent=DMON[calM]+' '+calY;
  const a=agg();
  const first=new Date(calY, calM, 1);
  const startDow=first.getDay();
  const dim=new Date(calY, calM+1, 0).getDate();
  const prevDim=new Date(calY, calM, 0).getDate();
  const today=todayMid();
  const wd=['wdSun','wdMon','wdTue','wdWed','wdThu','wdFri','wdSat'].map(k=>`<div class="calwd">${T(k)}</div>`).join('');
  let cells='';
  for(let i=0;i<42;i++){
    const dayNum=i-startDow+1;
    let dnum, cls='', dt=null;
    if(dayNum<1){ dnum=prevDim+dayNum; cls='other'; }
    else if(dayNum>dim){ dnum=dayNum-dim; cls='other'; }
    else { dnum=dayNum; dt=new Date(calY, calM, dayNum);
      if(dt.getTime()===today.getTime()) cls='today'; }
    let chips='';
    if(dt){
      const key=isoOf(dt);
      const dayTasks=a.rows.filter(r=>{ const d=odDeadline(r); return d && isoOf(d)===key; });
      chips=dayTasks.map(r=>`<span class="calchip ${isOverdue(r)?'od':''}" onclick="openDetail(${r.sl})" title="${esc(r.name)}">${esc(r.name)}</span>`).join('');
    }
    cells+=`<div class="calday ${cls}"><div class="dn">${dnum}</div>${chips}</div>`;
  }
  g.innerHTML=`<div class="calgrid">${wd}${cells}</div>`;
  const nd=a.rows.filter(r=>!odDeadline(r));
  const ndEl=document.getElementById('calNoDate');
  if(ndEl) ndEl.innerHTML=`<h4>${T('calNoDate')} — ${T('calNoDateSub')} (${nd.length})</h4>`+
    (nd.length? nd.map(r=>`<div class="ndrow" onclick="openDetail(${r.sl})"><span class="chip n">${esc(r.unit)}</span><span style="flex:1">${esc(r.name)}</span>${statusChip(r.status)}</div>`).join('') : `<p style="color:${thc().nodata};font-size:12px">${T('nodata')}</p>`);
}
/* ── Comments (COMMENTS tab): list + add box in the full-page task view. ── */
let dtCm=[], dtCmState='idle';
function cmAuthor(){ const a=allowedUnit(); return a==='ALL' ? 'Owner' : (a || 'Owner'); }
function cmBodyHtml(r){
  let h='';
  if(dtCmState==='loading'){ h+=`<div style="font-size:13px;color:var(--muted)">${T('cmLoading')}</div>`; return h; }
  if(!dtCm.length){ h+=`<div style="font-size:13px;color:var(--muted)">${T('cmEmpty')}</div>`; }
  else h+=dtCm.map(c=>`<div class="cmrow"><div class="cmh">${avatarHtml(c.author||'?',20)} <b>${esc(c.author||'—')}</b> · ${c.date?fmtD(c.date):''}</div><div>${esc(c.comment)}</div></div>`).join('');
  const canE=canEditUnit(r.unit);
  if(canE) h+=`<div class="cmadd"><input type="text" id="cmAuthor" class="efinput" style="max-width:180px" placeholder="${T('cmAuthorPh')}" value="${esc(cmAuthor())}"><input type="text" id="cmText" class="efinput" placeholder="${T('cmAddPh')}"><button class="entrybtn" onclick="cmAdd()">${T('cmPost')}</button></div><div id="cmMsg" class="fsmsg" style="padding:6px 0"></div>`;
  return h;
}
function cmRefresh(){ const b=document.getElementById('dtCmBody'); const r=rowBySl(dtRn); if(b&&r) b.innerHTML=cmBodyHtml(r); }
async function loadComments(quiet){
  const r=rowBySl(dtRn); if(!r) return;
  if(!scriptUrl()){ dtCmState='idle'; cmRefresh(); return; }
  if(!quiet){ dtCmState='loading'; cmRefresh(); }
  try{
    const res=await fetch(scriptUrl()+'?'+new URLSearchParams({action:'getcomments',token:curToken(),cb:Date.now()}),{redirect:'follow'});
    const j=await res.json();
    const fresh=(j&&j.ok&&Array.isArray(j.comments)) ? j.comments.filter(c=>String(c.sl)===String(r.sl)) : [];
    /* v10.38: keep optimistic local comments the server has not returned
       yet — deduped by author + text. */
    const pending=dtCm.filter(c=>c.local && !fresh.some(f=>String(f.comment||'').trim()===String(c.comment||'').trim() && String(f.author||'')===String(c.author||'')));
    dtCm=fresh.concat(pending);
  }catch(e){ dtCm=dtCm.filter(c=>c.local); }
  dtCmState='idle'; cmRefresh();
}
async function cmAdd(){
  const r=rowBySl(dtRn); if(!r) return;
  const text=((document.getElementById('cmText')||{}).value||'').trim();
  const author=((document.getElementById('cmAuthor')||{}).value||'').trim()||cmAuthor();
  const m=document.getElementById('cmMsg');
  const say=(t,c)=>{ if(m){ m.textContent=t; m.className='fsmsg '+(c||''); } };
  if(isStepMode()){ say(T('stepNote'),'err'); toast(T('stepNote'),'err'); return; }
  if(!text) return;
  const url=scriptUrl(), tok=curToken();
  if(!url||!tok){ say(T('msgNoScript'),'err'); toast(T('msgNoScript'),'err'); return; }
  /* v10.38: optimistic — the comment appears at once; the server write
     runs in the background and the comment is removed if it fails. */
  const local={sl:String(r.sl),author,comment:text,date:toISODate(todayMid()),local:true};
  dtCm.push(local);
  const tEl=document.getElementById('cmText'); if(tEl) tEl.value='';
  cmRefresh();
  toast(T('toastCmPost'),'ok');
  const q=new URLSearchParams({token:tok,action:'addcomment',sl:String(r.sl),unit:r.unit,task:r.name,author,comment:text});
  bgWrite(url,q,
    ()=>{ loadComments(true); },
    (e)=>{ dtCm=dtCm.filter(x=>x!==local); cmRefresh();
      const mm=document.getElementById('cmMsg'); if(mm){ mm.textContent=Tf('msgSaveFail',{e:e.message}); mm.className='fsmsg err'; } bgFailToast(e); });
}
/* ── v10.77: Attachments (ATTACHMENTS tab + Drive folder) — one file list
   per task, in the full-page task view, directly after Comments. Reads:
   master / step token see all rows, unit token only its own unit; we
   filter client-side by SL (same pattern as loadComments / loadLc).
   Writes: master + own-unit token only — NEVER a step token (not even
   step 3 or step 4), never a guest. Upload goes by POST (bgPost) as a
   JSON body {action:'uploadfile', token, sl, unit, task, fileName,
   mimeType, data} with data = raw base64 (no data: prefix) — the GET
   path would blow URL limits on base64. Files are capped at 10 MB
   client-side, before any request is sent. Delete is a GET deletefile
   with row + fileId, behind the shared confirm dialog. Both writes
   are optimistic (v10.38 pattern) with rollback + error toast. ── */
let dtAt=[], dtAtState='idle';
const AT_MAX_BYTES=10*1024*1024;
function canAttach(r){ if(isStepMode()) return false; return !!allowedUnit()&&canEditUnit(r.unit); }
function atBodyHtml(r){
  let h='';
  if(dtAtState==='loading'){ h+=`<div style="font-size:13px;color:var(--muted)">${T('atLoading')}</div>`; return h; }
  if(!dtAt.length){ h+=`<div style="font-size:13px;color:var(--muted)">${T('atEmpty')}</div>`; }
  else h+=dtAt.map(f=>{
    const view=f.url?`<a href="${escA(f.url)}" target="_blank" rel="noopener" style="font-size:13px">${esc(T('atView'))} ↗</a>`:'';
    const meta=[f.by||'', f.date?fmtD(f.date):''].filter(Boolean).join(' · ');
    const del=canAttach(r)?`<button class="subdel" title="${escA(T('atDelete'))}" onclick="atDel(${f.row||0},'${escA(String(f.fileId||''))}')">✕</button>`:'';
    return `<div class="cmrow"><div class="cmh"><b>${esc(f.fileName||'—')}</b>${f.local?' <span style="color:var(--muted)">(uploading…)</span>':''}</div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="font-size:12px;color:var(--muted)">${esc(meta)}</span>${view}${del}</div></div>`;
  }).join('');
  if(canAttach(r)) h+=`<div class="cmadd"><input type="file" id="atFile" class="efinput"><button class="entrybtn" onclick="atUpload()">${T('atUpload')}</button></div><div id="atMsg" class="fsmsg" style="padding:6px 0"></div>`;
  else if(isStepMode()) h+=`<div style="font-size:12.5px;color:var(--muted);margin-top:6px">${esc(T('atStepNote'))}</div>`;
  else if(!allowedUnit()) h+=`<div style="font-size:12.5px;color:var(--muted);margin-top:6px">${esc(T('atGuestNote'))}</div>`;
  return h;
}
function atRefresh(){ const b=document.getElementById('dtAtBody'); const r=rowBySl(dtRn); if(b&&r) b.innerHTML=atBodyHtml(r); }
async function loadAttachments(quiet){
  const r=rowBySl(dtRn); if(!r) return;
  if(!scriptUrl()){ dtAtState='idle'; atRefresh(); return; }
  if(!quiet){ dtAtState='loading'; atRefresh(); }
  try{
    const res=await fetch(scriptUrl()+'?'+new URLSearchParams({action:'getattachments',token:curToken(),cb:Date.now()}),{redirect:'follow'});
    const j=await res.json();
    const fresh=(j&&j.ok&&Array.isArray(j.files)) ? j.files.filter(f=>String(f.sl)===String(r.sl)) : [];
    /* v10.38: keep optimistic local files the server has not returned
       yet — deduped by file name. */
    const pending=dtAt.filter(f=>f.local && !fresh.some(x=>String(x.fileName||'').trim().toLowerCase()===String(f.fileName||'').trim().toLowerCase()));
    dtAt=fresh.concat(pending);
  }catch(e){ dtAt=dtAt.filter(f=>f.local); }
  dtAtState='idle'; atRefresh();
}
function atSay(t,c){ const m=document.getElementById('atMsg'); if(m){ m.textContent=t; m.className='fsmsg '+(c||''); } }
async function atUpload(){
  const r=rowBySl(dtRn); if(!r) return;
  const m=document.getElementById('atMsg');
  const say=(t,c)=>{ atSay(t,c); if(c==='err') toast(t,'err'); };
  if(!canAttach(r)){ say(isStepMode()?T('atStepNote'):T('atGuestNote'),'err'); return; }
  const input=document.getElementById('atFile');
  const file=input&&input.files&&input.files[0];
  if(!file){ say(T('atNoFile'),'err'); return; }
  if(file.size>AT_MAX_BYTES){ say(T('atTooBig'),'err'); return; }
  const url=scriptUrl(), tok=curToken();
  if(!url||!tok){ say(T('msgNoScript'),'err'); return; }
  const key='atUpload:'+r.sl+':'+file.name+'|'+file.size;
  if(!bgGuard(key)) return;
  /* v10.38: optimistic — the file appears at once (local:true, so its
     delete stays local until the server confirms it and
     loadAttachments() brings the real sheet row + fileId). */
  const local={sl:String(r.sl),unit:r.unit,task:r.name,fileName:file.name,mimeType:file.type||'',by:cmAuthor(),date:toISODate(todayMid()),local:true};
  dtAt.push(local);
  if(input) input.value='';
  atRefresh();
  toast(T('atSaved'),'ok');
  const fr=new FileReader();
  fr.onload=()=>{
    const du=String(fr.result||'');
    const comma=du.indexOf(',');
    const b64=comma>=0?du.slice(comma+1):du;
    bgPost(url,{action:'uploadfile',token:tok,sl:String(r.sl),unit:r.unit,task:r.name,fileName:file.name,mimeType:file.type||'',data:b64},
      ()=>{ bgRelease(key); loadAttachments(true); },
      (e)=>{ bgRelease(key); dtAt=dtAt.filter(x=>x!==local); atRefresh();
        const mm=document.getElementById('atMsg'); if(mm){ mm.textContent=Tf('msgSaveFail',{e:e.message}); mm.className='fsmsg err'; } bgFailToast(e); });
  };
  fr.onerror=()=>{ bgRelease(key); dtAt=dtAt.filter(x=>x!==local); atRefresh(); say(T('atLoadFail'),'err'); };
  fr.readAsDataURL(file);
}
async function atDel(row,fileId){
  const r=rowBySl(dtRn); if(!r) return;
  if(!canAttach(r)){ toast(isStepMode()?T('atStepNote'):T('atGuestNote'),'err'); return; }
  const ok=await confirmDlg(T('atConfirmDelete'), T('atConfirmDeleteB'));
  if(!ok) return;
  const url=scriptUrl(), tok=curToken();
  if(!url||!tok){ toast(T('msgNoScript'),'err'); return; }
  const idx=dtAt.findIndex(x=>String(x.row||'')===String(row)&&String(x.fileId||'')===String(fileId||''));
  if(idx<0) return;
  const f=dtAt[idx];
  if(f.local){ dtAt.splice(idx,1); atRefresh(); toast(T('atDeleted'),'ok'); return; }
  /* v10.38: optimistic — the file disappears at once; the server delete
     runs in the background and the row is restored if it fails. */
  dtAt.splice(idx,1);
  atRefresh();
  toast(T('atDeleted'),'ok');
  const q=new URLSearchParams({token:tok,action:'deletefile',sl:String(r.sl),unit:r.unit,task:r.name,row:String(row),fileId:String(fileId||'')});
  bgWrite(url,q,
    ()=>{ loadAttachments(true); },
    (e)=>{ dtAt.splice(Math.min(idx,dtAt.length),0,f); atRefresh(); bgFailToast(e); });
}
/* v10.77: attachment names for the detail print sheet — a plain name
   list after the workflow table, only when files are loaded. */
function atPrintHtml(){
  if(!dtAt.length) return '';
  return `<h3 style="margin:16px 0 6px">${esc(T('dtAttachments'))}</h3><ul style="font-size:13px;margin:0;padding-left:18px">`+
    dtAt.map(f=>`<li>${esc(f.fileName||'—')}${f.by?` — ${esc(f.by)}`:''}${f.date?` · ${fmtD(f.date)}`:''}</li>`).join('')+`</ul>`;
}
